rmpc_node:
  ros__parameters:
    # Pub/Sub
    # Pub/sub
    odom_topic: '/ego_racecar/odom'
    drive_topic: '/drive'
    viz_topic: '/waypoint_sphere'
    scan_topic : '/scan'
    grid_topic : '/local_map'
    # RHC params
    horizon: 100
    dt: 0.02
    samples : 5000


    ## Grid parameters
    resolution :  0.05
    width : 6.0 ## higher the width, higher no of rows, more lidar vision
    height  : 3.0

    ## Steerign and velocity profiles  
    v_max : 10.5
    v_min : 2.5              
    wheel_base : 0.33 
    min_steering_limit : -0.4189
    max_steering_limit : 0.4189
    max_steering_vel: 3.2


