rmpc_node:
  ros__parameters:
    # map parameters
    waypoints_file: 'waypoints/IMS_centerline.csv'
    # ROS 2 Topics
    odom_topic: '/ego_racecar/odom'
    drive_topic: '/drive'
    viz_topic: '/waypoint_sphere'
    scan_topic: '/scan'
    grid_topic: '/local_map'
    centerline_topic: '/centerline_marker'
    traj_topic: '/rmpc_trajectories'

    # RHC Parameters
    solver:
      horizon: 100
      dt: 0.02
      samples: 5000
      n_basis: 7
      seed: 70997
      warm_start: true
    
    # Occupancy Grid Parameters
    occupancy_grid:
      resolution: 0.05
      width: 6.0
      height: 3.0
      inflation_radius: 4
      lateral_clearance: 1
      hit_cost: 35000.0

    # Speed & Actuation Limits
    speed_limits:
      v_max: 10.5
      v_min: 2.5
      wheel_base: 0.3302
      max_steering_limit: 0.4189
      max_steering_vel: 3.2
      friction_coeff: 0.523
      gravity: 9.81
      max_accel: 7.51
      max_decel: 8.26

    # F1TENTH Car Parameters
    vehicle_dimensions:
      mass: 3.47
      lf: 0.15875
      lr: 0.17145
      Iz: 0.04712
      car_width: 0.2032
      rho: 1.225
      cl_f: 0.0
      cl_r: 0.0

      # Pacejka coefficients [B, C, E] (D is scaled by friction_coeff)
      tire_f_bce: [-6.0, 1.5, -0.1]
      tire_r_bce: [-7.0, 1.5, -0.1]

    # weights for the cost function (Reusing the weights from the original RMPC code)
    weights:
      lateral: [400.0, 600.0, 50.0]
      heading: [3500.0, 250.0, 500.0]
      terminal_lateral: [200.0, 400.0, 20.0]
      terminal_heading: [1500.0, 200.0, 100.0]
      
      progress: 0.5
      actuation: 0.05
      rate: 5.0
      decay: 0.3

      # Force constraints [gain, exponent]
      force_f: [20.0, 2.0]
      force_r: [20.0, 2.0]
      grip_limit_scaler: 1.0

      # Boundary constraints
      bound: 1500.0
      bound_margin: 0.08
      max_bound_cost: 1000.0

      # Slip constraints
      slip: 1000.0
      slip_threshold_f: 0.15
      slip_threshold_r: 0.15
      max_slip_cost: 5000.0